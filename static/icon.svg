<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256"
     viewBox="0 0 256 256" fill="none" role="img" aria-label="OmniText icon">
  <defs>
    <!-- Rainbow stroke (no red at the start) -->
    <linearGradient id="rainbow" x1="22" y1="22" x2="234" y2="234" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ff8a00"/>
      <stop offset="20%"  stop-color="#ffe600"/>
      <stop offset="40%"  stop-color="#25ff6a"/>
      <stop offset="60%"  stop-color="#00c8ff"/>
      <stop offset="80%"  stop-color="#6b4dff"/>
      <stop offset="100%" stop-color="#b400ff"/>
    </linearGradient>

    <radialGradient id="ringGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.00"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.00"/>
    </radialGradient>

    <style>
      .s { stroke: url(#rainbow); stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; }
      .s2 { stroke: url(#rainbow); stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
      .f { fill: url(#rainbow); }
    </style>

    <!-- Arrowhead -->
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12" class="f"/>
    </marker>
  </defs>

  <!-- Outer circle -->
  <circle cx="128" cy="128" r="106" class="s"/>
  <circle cx="128" cy="128" r="92" fill="url(#ringGlow)"/>

  <!-- Crop corners -->
  <path d="M72 88 V72 H88" class="s2"/>
  <path d="M168 72 H184 V88" class="s2"/>
  <path d="M184 168 V184 H168" class="s2"/>
  <path d="M88 184 H72 V168" class="s2"/>

  <!-- Directional arrows -->
  <path d="M128 72 V85" class="s2" />
  <path d="M130 184 V172" class="s2" />
  <path d="M72 128 H84" class="s2" />
  <path d="M184 128 H172" class="s2" />

  <!-- Center "T" (reduced straight line lengths) -->
  <path d="M116 110 H140" class="s"/>
  <path d="M128 110 V146" class="s"/>
</svg>
